[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nib-synth"
version = "0.1.0"
description = "Few-shot handwriting synthesis: learn a writer's hand from a page, generate new text in it."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Omri Tzabari" }]
keywords = ["handwriting", "generative-models", "computer-vision", "few-shot"]

# Base dependencies: everything needed for the data pipeline (T1-T8).
# Deliberately EXCLUDES torch -- see [project.optional-dependencies] below.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "omegaconf>=2.3",
    "lxml>=5.0",
    "tqdm>=4.66",
    "opencv-python>=4.9",
    "lmdb>=1.4",
]

[project.optional-dependencies]
# Colab ships its own torch build, matched to its CUDA driver. Installing ours
# on top would replace a working build with one that may not match the GPU.
# So torch is an extra: install it locally, skip it on Colab.
#
# Locally, prefer the CPU-only wheel -- 122 MB instead of several GB, and enough
# for everything that is not an actual training run:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
# Pinned to Colab's build, not to the newest. Colab is where training actually
# happens and its torch is matched to its CUDA driver, so it is the version that
# cannot move. A checkpoint written by a newer torch may not load in an older one,
# and the traffic in this project runs both ways.
torch = ["torch==2.11.*", "torchvision==0.26.*"]

# The generator and the metrics that judge it. Kept out of the base dependencies
# because the data layer must install and run without downloading gigabytes of
# model machinery -- the test suite does exactly that.
#
# **The transformers pin is load-bearing.** Emuru's own remote code defines
# `_tied_weights_keys`; transformers 5.x looks for `all_tied_weights_keys` and so
# cannot load the model at all. The same version gap breaks TrOCR's tokenizer.
# One cause, both failures. Until this session the pin was a decision written in
# PROGRESS.md and enforced nowhere, which meant a fresh Colab session would
# install 5.x and fail thirty minutes in.
models = [
    "transformers>=4.38,<5",
    "diffusers>=0.30",    # Emuru's VAE is a diffusers AutoencoderKL
    "einops>=0.7",        # used inside Emuru's remote code
    "safetensors>=0.4",
    "sentencepiece>=0.2", # the T5 and byt5 tokenizers
    "scipy>=1.11",        # the matrix square root inside FID
]

track = ["wandb>=0.16"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# Notebooks contain shell magics, which are not Python. The rule that they hold
# no logic is enforced by review, not by a linter.
extend-exclude = ["notebooks"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes -- unused imports, undefined names
    "I",   # isort -- import ordering
    "UP",  # pyupgrade -- modern syntax
    "B",   # bugbear -- likely bugs
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is handled by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["nib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
